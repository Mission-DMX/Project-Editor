name: Build editor and publish as package

on:
  push:
    tags:
      - "v*"

jobs:
  unit_tests:
    runs-on: [ self-hosted ]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install project dependencies
        run: pdm install --dev

      - name: Configure fish binary path for tests
        run: |
          echo "FISH_EXEC_PATH = \"$HOME/actions-runner/_work/realtime-fish/realtime-fish/bin/fish\"" > test/unittests/config.py

      - name: Run unit tests
        run: pdm run make test

  build_package:
    needs: unit_tests
    runs-on: [ self-hosted ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: make
        run: |
          pdm install --dev -G build
          pdm run make package

      - name: publish
        run: |
          cd bin
          find . -maxdepth 1 ! -name '*.deb' ! -name '.' -exec rm -rf {} +
          sudo /home/deploy/deploy.bash *.deb downloads/packages/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            bin/mission-dmx-editor-v*.deb
